name: Lint

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Python Syntax & Style Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Syntax check
        run: python -m py_compile safe-shutdown.py && echo "Syntax OK"

      - name: Style check (flake8)
        run: |
          flake8 safe-shutdown.py \
            --max-line-length=100 \
            --extend-ignore=E402
